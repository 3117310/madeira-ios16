name: Madeira iOS16 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch v010 tag
        run: |
          git fetch https://github.com/willfaust/Madeira.git refs/tags/v0.1.0:refs/tags/v0.1.0
          git checkout v0.1.0
          git submodule update --init --recursive

      - name: Xcode Version
        run: xcodebuild -version && xcodebuild -showsdks | grep iOS

      - name: Install Dependencies
        run: |
          brew install cmake ninja meson pkg-config autoconf automake libtool bison flex sevenzip llvm

      - name: Placeholder Missing Dirs
        run: |
          mkdir -p app/Madeira/x86_64-vcruntime
          mkdir -p app/Madeira/fonts-ja

      - name: Patch Observable
        run: |
          FILE="app/Madeira/SwiftSteam/Core/SteamSession.swift"
          sed -i '' 's/@Observable//g' "$FILE"
          sed -i '' 's/class SteamSession {/class SteamSession: ObservableObject {/' "$FILE"

      - name: Patch BGContinuedProcessingTask
        run: |
          FILE="app/Madeira/SteamDownloadBackground.swift"
          sed -i '' 's/BGContinuedProcessingTaskRequest/AnyObject/g' "$FILE"
          sed -i '' 's/BGContinuedProcessingTask/AnyObject/g' "$FILE"
          sed -i '' 's/if #available(iOS 26.0, \*)/if false/g' "$FILE"

      - name: Patch onChange
        run: |
          FILE1="app/Madeira/ConfigCatalog.swift"
          FILE2="app/Madeira/SteamGames.swift"
          sed -i '' 's/{ _, value in/{ value in/g' "$FILE1"
          sed -i '' 's/{ _, value in/{ value in/g' "$FILE2"

      - name: Patch SteamSignInView
        run: |
          FILE="app/Madeira/SwiftSteam/SteamSignInView.swift"
          sed -i '' '69,70d' "$FILE"
          sed -i '' '64,68d' "$FILE"
          sed -i '' '54,58d' "$FILE"

      - name: Build
        env:
          GITHUB_ACTIONS: "true"
        run: |
          set -o pipefail
          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log

      - name: Show Errors
        if: always()
        run: |
          echo "=== Swift Compile count ==="
          grep -c "SwiftCompile" build.log || echo "0"
          echo "=== Availability errors ==="
          grep -c "only available in iOS" build.log || echo "0"
          echo "=== All errors ==="
          grep "error:" build.log | head -30 || echo "none"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
